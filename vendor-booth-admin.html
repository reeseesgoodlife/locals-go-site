<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Bite Bar — Item Manager</title>
<style>
  :root {
    --green: #B4FF39; --gold: #FFD84D; --bg: #0a0a0a; --panel: #141414;
    --line: #262626; --text: #eee; --muted: #8a8a8a; --danger: #ff6161;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  body { padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--green); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .item-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .sku-badge {
    background: #1c1c1c; border: 1px solid var(--line); border-radius: 8px;
    padding: 3px 8px; font-size: 11px; color: var(--muted); font-weight: 700; flex-shrink: 0;
  }
  .name-input {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-size: 15px; font-weight: 700; outline: none; min-width: 0;
  }
  .price-row { display: flex; align-items: center; gap: 8px; }
  .price-row span { color: var(--muted); font-size: 14px; }
  .price-input {
    width: 80px; background: #1c1c1c; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; color: var(--gold); font-size: 15px; font-weight: 700; outline: none;
  }
  .price-input:focus { border-color: var(--green); }

  .stock-toggle {
    display: flex; align-items: center; gap: 8px; margin-left: auto; cursor: pointer;
    font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; border: 1px solid;
  }
  .stock-toggle.in { color: var(--green); border-color: rgba(180,255,57,.5); background: rgba(180,255,57,.08); }
  .stock-toggle.out { color: var(--danger); border-color: rgba(255,97,97,.5); background: rgba(255,97,97,.08); }

  .save-btn {
    align-self: flex-end; background: var(--green); color: #06210a; border: none;
    border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .save-btn.show { opacity: 1; pointer-events: auto; }
  .save-btn:disabled { opacity: .4; }

  .status { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0; }
</style>
</head>
<body>
  <h1>🍿 Sound Bite Bar — Item Manager</h1>
  <div class="sub">Edit prices or mark items sold out — changes go live instantly, no reprinting QR codes.</div>
  <div id="items"></div>
  <div class="status" id="status"></div>

<script>
  const SUPABASE_URL = "https://yudsmzobtfdqmdiohkun.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1uIYdtZUHOJxMnYSsOlgzg_dLngZ2rR";
  function headers(extra={}) {
    return { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, ...extra };
  }

  const itemsEl = document.getElementById("items");
  const statusEl = document.getElementById("status");

  async function loadItems() {
    statusEl.textContent = "Loading…";
    const res = await fetch(`${SUPABASE_URL}/rest/v1/vb_items?select=*&order=sku.asc`, { headers: headers() });
    const items = await res.json();
    statusEl.textContent = "";
    render(items);
  }

  function render(items) {
    itemsEl.innerHTML = "";
    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        <div class="row">
          <span class="sku-badge">#${item.sku}</span>
          <input class="name-input" value="${item.name}" data-field="name" />
        </div>
        <div class="row">
          <div class="price-row">
            <span>$</span>
            <input class="price-input" type="number" step="0.01" value="${item.price ?? ''}" data-field="price" />
          </div>
          <div class="stock-toggle ${item.in_stock ? 'in' : 'out'}" data-field="in_stock">
            ${item.in_stock ? '✓ In Stock' : '✕ Sold Out'}
          </div>
        </div>
        <button class="save-btn">Save</button>
      `;

      const saveBtn = card.querySelector(".save-btn");
      const nameInput = card.querySelector('[data-field="name"]');
      const priceInput = card.querySelector('[data-field="price"]');
      const stockToggle = card.querySelector('[data-field="in_stock"]');
      let inStock = item.in_stock;

      function markDirty() { saveBtn.classList.add("show"); }
      nameInput.addEventListener("input", markDirty);
      priceInput.addEventListener("input", markDirty);
      stockToggle.addEventListener("click", () => {
        inStock = !inStock;
        stockToggle.className = "stock-toggle " + (inStock ? "in" : "out");
        stockToggle.textContent = inStock ? "✓ In Stock" : "✕ Sold Out";
        markDirty();
      });

      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/vb_items?sku=eq.${item.sku}`, {
            method: "PATCH",
            headers: headers({ "Prefer": "return=minimal" }),
            body: JSON.stringify({
              name: nameInput.value,
              price: parseFloat(priceInput.value) || null,
              in_stock: inStock
            })
          });
          saveBtn.textContent = "Saved ✓";
          setTimeout(() => { saveBtn.classList.remove("show"); saveBtn.textContent = "Save"; saveBtn.disabled = false; }, 1200);
        } catch (e) {
          saveBtn.textContent = "Error — retry";
          saveBtn.disabled = false;
        }
      });

      itemsEl.appendChild(card);
    });
  }

  loadItems();
</script>
</body>
</html>
