<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locals Go — Share Opportunities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#08080a;--card:#101113;--lime:#B4FF39;--purple:#8B2FE0;--ink:#F2F2ED;--muted:#8A8A93;--line:rgba(242,242,237,0.09);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:32px 18px 60px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:-0.02em;margin-bottom:8px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--lime);letter-spacing:0.06em;margin-bottom:10px;}
  .sub{color:var(--muted);font-size:0.88rem;margin-bottom:24px;}

  .no-member{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;}
  .no-member a{display:inline-block;margin-top:14px;background:var(--lime);color:#08080a;font-family:'Space Grotesk',sans-serif;font-weight:600;padding:12px 22px;border-radius:100px;text-decoration:none;font-size:0.85rem;}

  .campaign-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;}
  .campaign-card img{width:100%;display:block;max-height:200px;object-fit:cover;}
  .campaign-card .body{padding:18px;}
  .campaign-card .cat{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:#c397f5;margin-bottom:6px;text-transform:uppercase;}
  .campaign-card h3{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;margin-bottom:6px;}
  .campaign-card p{color:var(--muted);font-size:0.85rem;line-height:1.5;margin-bottom:14px;}
  .action-row{display:flex;gap:8px;}
  .action-row button{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.8rem;padding:11px;border-radius:8px;border:none;cursor:pointer;}
  .btn-watch{background:var(--lime);color:#08080a;}
  .btn-share{background:var(--purple);color:#fff;}
  .btn-skip{background:transparent;color:var(--muted);border:1px solid var(--line) !important;}

  .empty{text-align:center;color:var(--muted);font-size:0.88rem;padding:50px 20px;}

  .share-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .share-modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:560px;}
  .share-modal h3{font-family:'Space Grotesk',sans-serif;margin-bottom:14px;}
  .share-modal textarea{width:100%;background:#08080a;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);font-family:'Inter',sans-serif;font-size:0.88rem;margin-bottom:14px;min-height:80px;}
  .share-option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .share-option{background:#08080a;border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;font-size:0.78rem;cursor:pointer;}
  .close-modal{width:100%;background:transparent;border:1px solid var(--line);color:var(--muted);padding:12px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">// 🔥 SHARE OPPORTUNITIES</div>
  <h1>Today's campaigns for you</h1>
  <p class="sub">Matched to your interests. Watch, share if you want, or skip — always your call.</p>
  <div id="content"><div class="empty">Loading…</div></div>
</div>

<div class="share-modal-overlay" id="share-modal-overlay">
  <div class="share-modal">
    <h3>Share this</h3>
    <textarea id="share-message-box"></textarea>
    <div class="share-option-grid">
      <div class="share-option" data-dest="native">📤 Share</div>
      <div class="share-option" data-dest="copy">🔗 Copy Link</div>
      <div class="share-option" data-dest="text">💬 Text</div>
      <div class="share-option" data-dest="email">✉️ Email</div>
      <div class="share-option" data-dest="facebook">Facebook</div>
      <div class="share-option" data-dest="x">X</div>
    </div>
    <button class="close-modal" id="close-modal-btn">Cancel</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://yudsmzobtfdqmdiohkun.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1ZHNtem9idGZkcW1kaW9oa3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1OTU4NjMsImV4cCI6MjEwMTE3MTg2M30.ew0qlTb2sFawIF0f_l8GqUwtS16utoF2wPdjsVO_Hnc";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const memberCode = localStorage.getItem('lg_member_code');
  let currentCampaign = null;

  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

  async function init() {
    if (!memberCode) {
      document.getElementById('content').innerHTML = `<div class="no-member">You're not in the Share Network yet.<br><a href="../join-network/">Join the Share Network</a></div>`;
      return;
    }

    const { data: member } = await sb.from('lg_share_network_members').select('*').eq('member_code', memberCode).maybeSingle();
    if (!member) {
      document.getElementById('content').innerHTML = `<div class="no-member">We couldn't find your membership.<br><a href="../join-network/">Join the Share Network</a></div>`;
      return;
    }

    let query = sb.from('lg_campaigns').select('*').eq('status', 'active').order('tier_priority', { ascending: false }).order('created_at', { ascending: false }).limit(5);
    const { data: campaigns } = await query;

    const matched = (campaigns || []).filter(c => {
      if (!member.interests || member.interests.length === 0) return true;
      if (!c.target_audience || c.target_audience.length === 0) return true;
      return c.target_audience.some(a => member.interests.some(i => a.toLowerCase().includes(i.toLowerCase()) || i.toLowerCase().includes(a.toLowerCase())));
    });

    const list = matched.length > 0 ? matched : campaigns;

    if (!list || list.length === 0) {
      document.getElementById('content').innerHTML = '<div class="empty">No campaigns right now — check back soon.</div>';
      return;
    }

    document.getElementById('content').innerHTML = list.map(c => `
      <div class="campaign-card" data-id="${c.id}">
        ${c.thumbnail_url ? `<img src="${c.thumbnail_url}">` : ''}
        <div class="body">
          <div class="cat">${escapeHtml(c.category||'')}</div>
          <h3>${escapeHtml(c.headline)}</h3>
          <p>${escapeHtml(c.description||'')}</p>
          <div class="action-row">
            <button class="btn-watch" data-action="watch" data-slug="${c.tracking_slug}">Watch</button>
            <button class="btn-share" data-action="share" data-id="${c.id}">Share</button>
            <button class="btn-skip" data-action="skip" data-id="${c.id}">Not Interested</button>
          </div>
        </div>
      </div>
    `).join('');

    for (const c of list) {
      await sb.from('lg_campaign_presentations').upsert(
        { campaign_id: c.id, member_id: member.id, presented_at: new Date().toISOString() },
        { onConflict: 'campaign_id,member_id', ignoreDuplicates: true }
      );
    }

    document.querySelectorAll('[data-action="watch"]').forEach(btn => btn.onclick = async () => {
      await sb.rpc('log_campaign_click', { slug: btn.dataset.slug, member_code: memberCode });
      const c = list.find(x => x.tracking_slug === btn.dataset.slug);
      window.open(c.content_url, '_blank');
    });

    document.querySelectorAll('[data-action="share"]').forEach(btn => btn.onclick = () => {
      currentCampaign = list.find(x => x.id === btn.dataset.id);
      openShareModal(currentCampaign);
    });

    document.querySelectorAll('[data-action="skip"]').forEach(btn => btn.onclick = () => {
      document.querySelector(`.campaign-card[data-id="${btn.dataset.id}"]`).remove();
    });
  }

  function openShareModal(campaign) {
    document.getElementById('share-message-box').value = campaign.share_message || campaign.headline;
    document.getElementById('share-modal-overlay').style.display = 'flex';
  }
  document.getElementById('close-modal-btn').onclick = () => document.getElementById('share-modal-overlay').style.display = 'none';

  document.querySelectorAll('.share-option').forEach(opt => {
    opt.onclick = async () => {
      const message = document.getElementById('share-message-box').value;
      const trackLink = `${window.location.origin}/watch/?c=${currentCampaign.tracking_slug}&m=${memberCode}`;
      const dest = opt.dataset.dest;

      if (dest === 'native' && navigator.share) {
        await navigator.share({ title: currentCampaign.headline, text: message, url: trackLink });
      } else if (dest === 'copy') {
        await navigator.clipboard.writeText(`${message} ${trackLink}`);
        opt.textContent = 'Copied!';
      } else if (dest === 'text') {
        window.location.href = `sms:?body=${encodeURIComponent(message + ' ' + trackLink)}`;
      } else if (dest === 'email') {
        window.location.href = `mailto:?subject=${encodeURIComponent(currentCampaign.headline)}&body=${encodeURIComponent(message + ' ' + trackLink)}`;
      } else if (dest === 'facebook') {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(trackLink)}`, '_blank');
      } else if (dest === 'x') {
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}&url=${encodeURIComponent(trackLink)}`, '_blank');
      }

      await sb.from('lg_campaign_shares').insert({
        campaign_id: currentCampaign.id,
        member_id: (await sb.from('lg_share_network_members').select('id').eq('member_code', memberCode).single()).data?.id,
        destination: dest,
        tracking_id: `${currentCampaign.tracking_slug}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`
      });

      setTimeout(() => document.getElementById('share-modal-overlay').style.display = 'none', 600);
    };
  });

  init();
</script>
</body>
</html>
