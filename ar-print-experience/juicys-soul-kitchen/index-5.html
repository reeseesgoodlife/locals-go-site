<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Juicy's Soul Kitchen - AR Experience</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #scanning-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); color: white; display: flex;
      flex-direction: column; justify-content: center; align-items: center;
      font-family: sans-serif; font-size: 1.2rem; z-index: 9999;
      pointer-events: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="scanning-overlay">
    <p>Point camera at the Juicy's Soul Kitchen card...</p>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta:0.01;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="ar-video" src="./animation.mp4" preload="auto" loop="true" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <a-video src="#ar-video" width="1" height="1.7" position="0 0 0" rotation="0 0 0"></a-video>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector('#ar-target');
      const videoElement = document.querySelector('#ar-video');
      const overlay = document.querySelector('#scanning-overlay');

      targetEntity.addEventListener("targetFound", () => {
        overlay.classList.add('hidden');
        videoElement.play();
      });

      targetEntity.addEventListener("targetLost", () => {
        overlay.classList.remove('hidden');
        videoElement.pause();
      });
    });
  </script>
</body>
</html>
