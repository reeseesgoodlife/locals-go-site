<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d10"><title>List Your Property — Locals Go</title><style>
:root{--bg:#0d0d10;--card:#17171c;--field:#202027;--line:#303039;--text:#f7f7f8;--muted:#aaaab5;--lime:#b4ff39;--purple:#8b2fe0;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#2b1244 0,transparent 30rem),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:5rem}.shell{max-width:760px;margin:auto;padding:0 18px}.top{height:64px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;letter-spacing:-.04em;text-decoration:none;color:#fff}.brand span{color:var(--lime)}.back{color:var(--muted);text-decoration:none;font-weight:700}.hero{padding:38px 0 22px}.badge{color:var(--lime);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(32px,7vw,52px);line-height:1;letter-spacing:-.055em;margin:8px 0 12px}.hero p,.note p{color:var(--muted);margin:0}.note,.section{background:#17171cf0;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px}.note{border-color:#8b2fe066;background:linear-gradient(135deg,#8b2fe017,#17171c)}fieldset{border:0}.section legend{font-weight:900;font-size:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.field{display:grid;gap:6px}.field label{font-size:14px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--field);color:#fff;padding:12px;font:inherit}.field textarea{min-height:100px;resize:vertical}.field :focus{outline:2px solid var(--lime);outline-offset:1px}.rooms{display:grid;gap:12px}.room{background:#101014;border:1px solid var(--line);border-radius:16px;padding:15px}.room-head{display:flex;gap:10px;align-items:end;margin-bottom:12px}.room-head .field{flex:1}.room-head button{padding:10px 14px;border:none;border-radius:8px;background:var(--red);color:#fff;cursor:pointer;font-weight:700;align-self:end}.room-photos{display:grid;gap:8px;margin-bottom:12px}.photo-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.photo-item input{flex:1}.photo-item button{padding:8px 12px;border:none;border-radius:8px;background:var(--line);color:var(--muted);cursor:pointer}.add-room{margin-top:12px;padding:12px;border:2px dashed var(--line);border-radius:12px;background:0;color:var(--lime);cursor:pointer;font-weight:700;width:100%}.submit{width:100%;padding:16px;border:none;border-radius:12px;background:var(--lime);color:#000;font-size:16px;font-weight:900;cursor:pointer;margin-top:24px}.submit:hover{opacity:.9}.status{text-align:center;color:var(--lime);margin-top:12px;font-size:14px}
</style></head><body><div class="shell"><div class="top"><a href="index.html" class="brand">Locals <span>Go</span></a><a href="index.html" class="back">← View</a></div><div class="hero"><p class="badge">📋 List Your Property</p><h1>Start accepting tours</h1><p>Create an immersive walkthrough with photos, 360° views, and AR models — all in minutes.</p></div><div class="note"><p><strong>🚀 Founding tier:</strong> List your property now and get preferred placement in the directory.</p></div><form id="listingForm"><fieldset class="section"><legend>Property Details</legend><div class="grid"><div class="field wide"><label>Address</label><input type="text" name="address" placeholder="123 Main St" required></div><div class="field"><label>City</label><input type="text" name="city" placeholder="Lawton, OK 73505" required></div><div class="field"><label>Price</label><input type="text" name="price" placeholder="$250,000" required></div><div class="field"><label>Bedrooms</label><input type="number" name="bedrooms" min="0" value="3"></div><div class="field"><label>Bathrooms</label><input type="number" name="bathrooms" min="0" step="0.5" value="2"></div><div class="field"><label>Sq Ft</label><input type="number" name="sqft" min="0" value="1800"></div><div class="field"><label>Property Type</label><select name="property_type"><option>Single-family home</option><option>Condo</option><option>Townhouse</option><option>Multi-family</option><option>Land</option></select></div><div class="field"><label>Year Built</label><input type="number" name="year_built" min="1800" value="2000"></div><div class="field wide"><label>Description</label><textarea name="description" placeholder="Describe your property..."></textarea></div></div></fieldset><fieldset class="section"><legend>Your Contact Info</legend><div class="grid"><div class="field"><label>Your Name</label><input type="text" name="agent_name" placeholder="Your name" required></div><div class="field"><label>Email</label><input type="email" name="agent_email" placeholder="you@example.com" required></div><div class="field"><label>Phone</label><input type="tel" name="agent_phone" placeholder="+1 (555) 000-0000"></div></div></fieldset><fieldset class="section"><legend>Rooms & Photos</legend><div class="rooms" id="roomsList"></div><button type="button" class="add-room" onclick="addRoom()">+ Add Room</button></fieldset><button type="submit" class="submit">Save & Publish</button><div class="status" id="status"></div></form></div><script>const CONFIG={supabaseUrl:"https://yudsmzobtfdqmdiohkun.supabase.co",supabaseAnonKey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1ZHNtem9idGZkcW1kaW9oa3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1OTU4NjMsImV4cCI6MjEwMTE3MTg2M30.ew0qlTb2sFawIF0f_l8GqUwtS16utoF2wPdjsVO_Hnc"};const db=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);let rooms=[];function addRoom(){const id=Date.now();rooms.push({id,name:"",photos:[]});renderRooms()}function removeRoom(id){rooms=rooms.filter(r=>r.id!==id);renderRooms()}function addPhoto(roomId){const room=rooms.find(r=>r.id===roomId);if(room)room.photos.push("");renderRooms()}function removePhoto(roomId,idx){const room=rooms.find(r=>r.id===roomId);if(room)room.photos.splice(idx,1);renderRooms()}function updateRoom(id,field,value){const room=rooms.find(r=>r.id===id);if(room)room[field]=value}function updatePhoto(roomId,idx,value){const room=rooms.find(r=>r.id===roomId);if(room)room.photos[idx]=value}function renderRooms(){const list=document.getElementById("roomsList");list.innerHTML="";rooms.forEach(room=>{const div=document.createElement("div");div.className="room";div.innerHTML=`<div class="room-head"><div class="field" style="flex:1"><input type="text" placeholder="Room name (e.g., Living Room)" value="${room.name}" onchange="updateRoom(${room.id},'name',this.value)"></div><button type="button" onclick="removeRoom(${room.id})">Remove</button></div><div class="room-photos">${room.photos.map((p,i)=>`<div class="photo-item"><input type="url" placeholder="Photo URL" value="${p}" onchange="updatePhoto(${room.id},${i},this.value)"><button type="button" onclick="removePhoto(${room.id},${i})">×</button></div>`).join("")}</div><button type="button" class="add-room" onclick="addPhoto(${room.id})" style="margin-top:0">+ Add photo</button>`;list.appendChild(div)})}document.getElementById("listingForm").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget;const btn=form.querySelector(".submit");const status=document.getElementById("status");btn.disabled=true;btn.textContent="Publishing...";status.textContent="";const formData={address:form.address.value,city:form.city.value,price:form.price.value,beds_baths:`${form.bedrooms.value} beds · ${form.bathrooms.value} baths`,sqft:parseInt(form.sqft.value),property_type:form.property_type.value,year_built:parseInt(form.year_built.value),description:form.description.value,agent_name:form.agent_name.value,agent_email:form.agent_email.value,agent_phone:form.agent_phone.value,rooms:rooms.filter(r=>r.name),status:"active"};try{const {data,error}=await db.from("listings").insert([formData]).select();if(error)throw error;const id=data[0].id;status.textContent="✓ Published! Opening walkthrough...";setTimeout(()=>{window.location.href=`index.html?id=${id}`},1000)}catch(err){console.error(err);status.textContent="Error: "+err.message;btn.disabled=false;btn.textContent="Save & Publish"}});addRoom();renderRooms()</script></body></html>
