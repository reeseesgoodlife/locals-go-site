<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Lookup</title>
<style>
  :root { --green: #B4FF39; --bg: #0a0a0a; --panel: #141414; --line: #262626; --text: #eee; --muted: #8a8a8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: -apple-system, "Segoe UI", Arial, sans-serif; color: var(--text); }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden; text-align: center;
  }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; display: none; }
  .card-body { padding: 22px; }
  .name { font-size: 20px; font-weight: 800; margin: 0 0 6px; }
  .price { font-size: 28px; font-weight: 900; color: var(--green); margin: 0 0 10px; }
  .desc { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
  .stock { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .stock.in { background: rgba(180,255,57,.15); color: var(--green); border: 1px solid rgba(180,255,57,.4); }
  .stock.out { background: rgba(255,97,97,.15); color: #ff6161; border: 1px solid rgba(255,97,97,.4); }
  .sku { margin-top: 16px; font-size: 11px; color: var(--muted); letter-spacing: .5px; }
  .loading, .error { color: var(--muted); padding: 40px 20px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loading" id="loading">Loading item…</div>
  </div>

<script>
  const SUPABASE_URL = "https://yudsmzobtfdqmdiohkun.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1uIYdtZUHOJxMnYSsOlgzg_dLngZ2rR";

  const params = new URLSearchParams(window.location.search);
  const sku = params.get("item");
  const cardEl = document.getElementById("card");

  async function loadItem() {
    if (!sku) {
      cardEl.innerHTML = `<div class="error">No item specified.</div>`;
      return;
    }
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/vb_items?sku=eq.${encodeURIComponent(sku)}&select=*`,
        { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
      );
      const rows = await res.json();
      if (!rows.length) {
        cardEl.innerHTML = `<div class="error">Item not found.</div>`;
        return;
      }
      const item = rows[0];
      const priceText = item.price != null ? `$${Number(item.price).toFixed(2)}` : "Price on request";
      cardEl.innerHTML = `
        ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" style="display:block">` : ""}
        <div class="card-body">
          <div class="name">${item.name}</div>
          <div class="price">${priceText}</div>
          ${item.description ? `<div class="desc">${item.description}</div>` : ""}
          <span class="stock ${item.in_stock ? 'in' : 'out'}">${item.in_stock ? 'In Stock' : 'Sold Out'}</span>
          <div class="sku">SKU #${item.sku}</div>
        </div>
      `;
    } catch (e) {
      cardEl.innerHTML = `<div class="error">Couldn't load item. Check your connection.</div>`;
    }
  }
  loadItem();
</script>
</body>
</html>
